[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-subtitle-studio"
version = "0.1.0-rc.2"
description = "Windows desktop subtitle transcription and translation studio."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "AI Subtitle Studio" }]
dependencies = [
    "PySide6>=6.7",
    # whisperx stable checked 2026-07-30
    "whisperx==3.8.6",
    # WhisperX 3.8.6 companion versions; install CUDA wheels via setup script/Dockerfile.
    "torch>=2.8,<2.14",
    "torchvision~=0.23.0",
    "torchaudio~=2.8.0",
    "httpx>=0.27",
    "keyring>=25",
    "pyinstaller>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-qt>=4",
    "pip-audit>=2.10.1,<3",
]
ci = [
    "pytest>=9.0.3,<10",
    "pytest-qt>=4,<5",
    "PySide6>=6.7,<7",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
    "jsonschema>=4,<5",
    "PyYAML>=6,<7",
    "pip-audit>=2.10.1,<3",
]

[project.scripts]
ai-subtitle-studio = "ai_subtitle_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_subtitle_studio = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
