name: Windows release bundle

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        type: string
      channel:
        description: Publication channel
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - stable

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-bundle:
    runs-on: [self-hosted, Windows, X64, ai-subtitle-release]
    environment: windows-release
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Resolve immutable release identity
        id: identity
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $Version = "${{ github.ref_name }}".TrimStart("v")
            $Channel = if ($Version.Contains("-")) { "prerelease" } else { "stable" }
          }
          else {
            $Version = "${{ inputs.version }}"
            $Channel = "${{ inputs.channel }}"
          }
          if ($Version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $Version"
          }
          $Project = Get-Content -Raw pyproject.toml
          if ($Project -notmatch "(?m)^version\s*=\s*`"$([regex]::Escape($Version))`"$") {
            throw "Workflow version must match pyproject.toml."
          }
          "version=$Version" >> $env:GITHUB_OUTPUT
          "tag=v$Version" >> $env:GITHUB_OUTPUT
          "channel=$Channel" >> $env:GITHUB_OUTPUT

      - name: Build and smoke frozen runtime
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version "${{ steps.identity.outputs.version }}" -Clean

      - name: Materialize signing certificate
        id: signing
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
        run: |
          $CertificatePath = Join-Path $env:RUNNER_TEMP "ai-subtitle-signing.pfx"
          if ($env:SIGNING_PFX_BASE64) {
            [IO.File]::WriteAllBytes($CertificatePath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            "available=true" >> $env:GITHUB_OUTPUT
            "certificate_path=$CertificatePath" >> $env:GITHUB_OUTPUT
          }
          else {
            "available=false" >> $env:GITHUB_OUTPUT
          }
          if ("${{ steps.identity.outputs.channel }}" -eq "stable" -and -not $env:SIGNING_PFX_BASE64) {
            throw "Stable release requires the protected SIGNING_PFX_BASE64 secret."
          }

      - name: Sign application runtime
        if: steps.signing.outputs.available == 'true'
        shell: pwsh
        env:
          AI_SUBTITLE_SIGNING_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          ./scripts/sign-release.ps1 `
            -Path "./dist/ai-subtitle-studio/ai-subtitle-studio.exe" `
            -CertificatePath "${{ steps.signing.outputs.certificate_path }}"
          ./scripts/smoke-frozen.ps1 -DistPath "./dist/ai-subtitle-studio"

      - name: Package runtime volumes
        shell: pwsh
        run: ./scripts/package-runtime.ps1 -Version "${{ steps.identity.outputs.version }}"

      - name: Stage notices and SBOM
        shell: pwsh
        run: |
          Copy-Item THIRD_PARTY_NOTICES.md "release/THIRD-PARTY-NOTICES-v${{ steps.identity.outputs.version }}.txt"
          Copy-Item "release-staging/build/SBOM-v${{ steps.identity.outputs.version }}.json" "release/SBOM-v${{ steps.identity.outputs.version }}.json"

      - name: Build online installer
        shell: pwsh
        env:
          AI_SUBTITLE_SIGNING_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $Arguments = @{
            Version = "${{ steps.identity.outputs.version }}"
            Owner = "${{ github.repository_owner }}"
            Repository = "${{ github.event.repository.name }}"
            Channel = "${{ steps.identity.outputs.channel }}"
          }
          if ("${{ steps.identity.outputs.channel }}" -eq "stable") {
            $Arguments.CertificatePath = "${{ steps.signing.outputs.certificate_path }}"
          }
          ./scripts/build-installer.ps1 @Arguments

      - name: Verify local release candidate
        shell: pwsh
        run: ./scripts/verify-release.ps1 -Version "${{ steps.identity.outputs.version }}"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-subtitle-studio-${{ steps.identity.outputs.tag }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Attest build provenance when supported
        if: github.event.repository.visibility == 'public' || vars.ENABLE_PRIVATE_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/*

      - name: Remove signing material
        if: always() && steps.signing.outputs.available == 'true'
        shell: pwsh
        run: |
          $CertificatePath = "${{ steps.signing.outputs.certificate_path }}"
          if ($CertificatePath.StartsWith($env:RUNNER_TEMP) -and (Test-Path -LiteralPath $CertificatePath)) {
            Remove-Item -LiteralPath $CertificatePath -Force
          }
