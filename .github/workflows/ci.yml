name: Source CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test environment
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install "pytest>=9.0.3,<10" "pytest-qt>=4,<5" "PySide6>=6.7,<7" "httpx>=0.27,<1" "keyring>=25,<26" "jsonschema>=4,<5" "PyYAML>=6,<7"
      - name: Compile sources
        run: python -m compileall src tests
      - name: Run source tests
        run: python -m pytest
      - name: Verify repository hygiene
        shell: pwsh
        run: ./scripts/verify-repository.ps1
