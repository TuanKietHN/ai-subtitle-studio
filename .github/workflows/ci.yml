name: Source CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test environment
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install "pytest>=9.0.3,<10" "pytest-qt>=4,<5" "PySide6>=6.7,<7" "httpx>=0.27,<1" "keyring>=25,<26" "jsonschema>=4,<5" "PyYAML>=6,<7"
      - name: Compile sources
        run: python -m compileall src tests
      - name: Run source tests
        run: python -m pytest
      - name: Verify repository hygiene
        shell: pwsh
        run: ./scripts/verify-repository.ps1
